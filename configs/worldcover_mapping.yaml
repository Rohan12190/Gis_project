# ESA WorldCover 2020 to GreenPlan 5-Class Taxonomy Remapping Configuration
# Reference: ESA WorldCover v100 Product User Manual & GreenPlan Taxonomy
#
# GreenPlan Classes:
# 0: Built-up
# 1: Green space
# 2: Farmland
# 3: Water
# 4: Bare land
# -1: Unmapped / nodata
#
# Assumptions:
# - Grassland (code 30) and Shrubland (code 20) are grouped into Green space (1)
# - Herbaceous wetland (code 90) is grouped into Water (3) as a hydrological buffer
worldcover_mapping:
  10: 1   # Tree cover -> Green space
  20: 1   # Shrubland -> Green space (perennial vegetation canopy)
  30: 1   # Grassland -> Green space (herbaceous ground vegetation)
  40: 2   # Cropland -> Farmland
  50: 0   # Built-up -> Built-up (impervious artificial surfaces)
  60: 4   # Bare / sparse vegetation -> Bare land
  70: 4   # Snow and ice -> Bare land
  80: 3   # Permanent water bodies -> Water
  90: 3   # Herbaceous wetland -> Water (wetlands and retention zones)
  95: 1   # Mangroves -> Green space
  100: 4  # Moss and lichen -> Bare land

default_unmapped: -1
